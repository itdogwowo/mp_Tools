[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mptools"
version = "0.1.0"
description = "跨平臺 MicroPython / CircuitPython 開發者工作臺：燒錄、IDE、REPL、檔案同步"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # 三個都已經是本機既有依賴，不需要額外安裝
    "pyserial>=3.5",
    "esptool>=5.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mpt = "mptools.cli:main"

[tool.setuptools.packages.find]
include = ["mptools*"]

# 注意：`web/` **不是**這個 Python 套件的一部分 —— 它是獨立的靜態 UI。
# `mptools/web/server.py` 用相對路徑找到它（repo 根目錄的 `web/`）。
# 所以這裡不需要 package-data；裝成 wheel 時要另外把 `web/` 一起帶上，
# 但那個情況下 server.py 的路徑解析也要跟著改。目前以「從 repo 執行」為主。

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
