[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mptools"
version = "0.1.0"
description = "跨平臺 MicroPython / CircuitPython 開發者工作臺：燒錄、IDE、REPL、檔案同步"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    # 三個都已經是本機既有依賴，不需要額外安裝
    "pyserial>=3.5",
    "esptool>=5.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[project.scripts]
mpt = "mptools.cli:main"

[tool.setuptools.packages.find]
include = ["mptools*"]

[tool.setuptools.package-data]
mptools = ["web/*", "web/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
