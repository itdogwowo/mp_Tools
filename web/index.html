<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mp_Tools — MicroPython 工作臺</title>
<!-- 字型已下載到本地（web/vendor/fonts/）。**刻意不連 Google Fonts CDN** ——
     這個工具要能完全離線使用，而且不該把使用者的 IP 送給第三方。 -->
<link rel="stylesheet" href="./vendor/fonts.css">
<style>
/* ═══════════════════════════════════════════════════════════════════════
   mp_Tools design tokens — 名稱與 docs/UI-DESIGN.md 及 tokens.css 一致
   ═══════════════════════════════════════════════════════════════════════ */
:root {
  --bench-950: #0b0c0e;
  --bench-900: #101216;
  --bench-850: #15181d;
  --bench-800: #1b1f26;
  --bench-700: #262b34;
  --bench-600: #39404d;
  --bench-400: #6b7486;
  --bench-200: #aeb6c4;
  --bench-100: #e4e8ef;

  --led: #2fe0a8;
  --led-dim: #14654c;
  --amber: #f0a53c;
  --danger: #ff5a5f;
  --solder: #58c4dc;

  --font-display: "Archivo", system-ui, sans-serif;
  --font-ui: "IBM Plex Sans", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, monospace;

  --rail-w: 64px;
  --strip-h: 56px;
  --side-w: 288px;
  --panel-h: 240px;
  --status-h: 28px;
  --t: cubic-bezier(.2,.8,.2,1);
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0;
  background: var(--bench-950);
  color: var(--bench-200);
  font: 400 13px/1.5 var(--font-ui);
  overflow: hidden;
  -webkit-font-smoothing: antialiased;
}
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
:focus-visible { outline: 2px solid var(--solder); outline-offset: 2px; }

/* raily 的區段標籤：整個介面的節拍器 */
.label {
  font: 600 10px/1 var(--font-display);
  letter-spacing: .09em;
  text-transform: uppercase;
  color: var(--bench-400);
}
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

/* ═══ 版面骨架 ═══ */
#app {
  display: grid;
  grid-template-columns: var(--rail-w) 1fr;
  grid-template-rows: var(--strip-h) 1fr var(--status-h);
  grid-template-areas: "rail strip" "rail body" "rail status";
  height: 100vh;
}

/* ── 左側 activity rail ── */
.rail {
  grid-area: rail;
  background: var(--bench-900);
  border-right: 1px solid var(--bench-700);
  display: flex; flex-direction: column; align-items: center;
  padding: 8px 0; gap: 4px;
}
.rail .mark {
  width: 36px; height: 36px; margin-bottom: 8px;
  display: grid; place-items: center;
  border: 1px solid var(--bench-700); border-radius: 8px;
  font: 700 13px/1 var(--font-display); color: var(--led);
  letter-spacing: -.02em;
}
.rail button.nav {
  position: relative;
  width: 44px; height: 44px; border-radius: 8px;
  display: grid; place-items: center; gap: 1px;
  color: var(--bench-400);
  transition: color 120ms ease-out, background 120ms ease-out;
}
.rail button.nav svg { width: 18px; height: 18px; }
.rail button.nav span { font: 500 9px/1 var(--font-ui); }
.rail button.nav:hover { color: var(--bench-200); background: var(--bench-850); }
.rail button.nav[aria-current="true"] { color: var(--bench-100); background: var(--bench-850); }
.rail button.nav[aria-current="true"]::before {
  content: ""; position: absolute; left: -8px; top: 10px; bottom: 10px;
  width: 2px; background: var(--led); border-radius: 2px;
}
.rail button.nav:disabled { color: var(--bench-700); cursor: not-allowed; }
.rail button.nav:disabled:hover { background: none; color: var(--bench-700); }
.rail .dot {
  position: absolute; top: 7px; right: 8px;
  width: 6px; height: 6px; border-radius: 99px; background: var(--amber);
}
.rail .spacer { flex: 1; }

/* ── 頂部 device strip ── */
.strip {
  grid-area: strip;
  background: var(--bench-900);
  border-bottom: 1px solid var(--bench-700);
  display: flex; align-items: center; gap: 12px; padding: 0 16px;
}
.strip .empty-slot {
  display: flex; align-items: center; gap: 8px;
  height: 34px; padding: 0 14px;
  border: 1px dashed var(--bench-600); border-radius: 8px;
  color: var(--bench-400); font-size: 12px;
  transition: border-color 120ms, color 120ms;
}
.strip .empty-slot:hover { border-color: var(--solder); color: var(--bench-100); }
.ticket {
  position: relative;
  display: flex; align-items: center; gap: 10px;
  height: 34px; padding: 0 12px 0 24px;
  background: var(--bench-850);
  border: 1px solid var(--bench-700); border-radius: 8px;
  transition: border-color 120ms;
}
.ticket[data-active="true"] { border-color: var(--bench-600); }
.ticket[data-active="true"]::before {
  content: ""; position: absolute; left: 8px; top: 6px; bottom: 6px;
  width: 2px; border-radius: 2px; background: var(--led);
}
.ticket .name { font: 500 12px/1 var(--font-ui); color: var(--bench-100); }
.ticket .meta { font: 400 11px/1 var(--font-mono); color: var(--bench-400); }
.led {
  width: 8px; height: 8px; border-radius: 99px; flex: 0 0 auto;
  background: var(--bench-700); box-shadow: 0 0 0 0 transparent;
}
.led[data-state="connecting"] { background: var(--led); animation: pulse 1.4s ease-in-out infinite; }
.led[data-state="idle"] { background: var(--led); }
.led[data-state="busy"] { background: var(--amber); animation: pulse .9s ease-in-out infinite; }
.led[data-state="error"] { background: var(--danger); }
@keyframes pulse {
  0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgb(47 224 168 / .45); }
  50% { opacity: .55; box-shadow: 0 0 0 5px rgb(47 224 168 / 0); }
}
.strip .grow { flex: 1; }

/* ── 主體 ── */
.body { grid-area: body; display: grid; grid-template-columns: var(--side-w) 1fr; min-height: 0; }

.side {
  background: var(--bench-900);
  border-right: 1px solid var(--bench-700);
  display: flex; flex-direction: column; min-height: 0;
}
.side-head {
  height: 38px; flex: 0 0 auto;
  display: flex; align-items: center; gap: 8px; padding: 0 12px;
  background: linear-gradient(to bottom, transparent, rgb(38 43 52 / .55), transparent);
  border-bottom: 1px solid var(--bench-700);
}
.side-body { overflow-y: auto; padding: 12px; flex: 1; min-height: 0; }
.side-foot { border-top: 1px solid var(--bench-700); padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; }

/* 裝置資訊 definition list */
.dl { display: grid; grid-template-columns: 66px 1fr; gap: 8px 10px; margin: 0; align-items: start; }
.dl dt { font: 600 9px/1.9 var(--font-display); letter-spacing: .08em; text-transform: uppercase; color: var(--bench-400); }
.dl dd { margin: 0; font: 400 12px/1.4 var(--font-mono); color: var(--bench-200); word-break: break-all; }
.meter { height: 4px; border-radius: 99px; background: var(--led-dim); overflow: hidden; margin-top: 5px; }
.meter i { display: block; height: 100%; background: var(--led); }
/* 琥珀儀表要有自己的軌道色，否則會被誤讀成綠色的「正常」儀表 */
.meter[data-tone="amber"] { background: rgb(240 165 60 / .18); }
.meter[data-tone="amber"] i { background: var(--amber); }

/* 檔案樹 */
.tree { font: 400 12px/1 var(--font-ui); }
.tree .row {
  position: relative;
  display: flex; align-items: center; gap: 6px;
  height: 26px; padding: 0 8px 0 6px; border-radius: 4px;
  color: var(--bench-200); cursor: default;
}
.tree .row:hover { background: var(--bench-850); }
.tree .row[data-selected="true"] { background: var(--bench-800); color: var(--bench-100); }
.tree .row .sz { margin-left: auto; font: 400 10px/1 var(--font-mono); color: var(--bench-400); }
.tree .row .tw { width: 10px; color: var(--bench-400); font-size: 9px; }
.tree .row .ic { width: 14px; display: grid; place-items: center; }
.tree .indent { padding-left: 16px; }
.tree .indent2 { padding-left: 32px; }
.tree .up { position: absolute; left: 0; right: 6px; bottom: 0; height: 2px; background: var(--bench-700); border-radius: 2px; }
.tree .up i { display: block; height: 100%; background: var(--amber); border-radius: 2px; }

/* ── canvas + bottom panel ── */
.canvas-wrap { display: grid; grid-template-rows: 1fr 6px var(--panel-h); min-height: 0; }
.canvas {
  position: relative; overflow: hidden; min-height: 0;
  background-color: var(--bench-950);
  background-image:
    radial-gradient(120% 90% at 50% 0%, rgb(47 224 168 / .022), transparent 60%),
    radial-gradient(circle at 1px 1px, rgb(38 43 52 / .55) 1px, transparent 0);
  background-size: 100% 100%, 16px 16px;
}
.view { position: absolute; inset: 0; overflow-y: auto; display: none; }
.view[data-on="true"] { display: block; }

.grip { background: var(--bench-900); border-top: 1px solid var(--bench-700); cursor: row-resize; }
.grip:hover { background: var(--bench-850); }

.panel { background: var(--bench-900); border-top: 1px solid var(--bench-700); display: flex; flex-direction: column; min-height: 0; }
.panel-head {
  height: 34px; flex: 0 0 auto; display: flex; align-items: center; gap: 4px; padding: 0 8px 0 12px;
  background: linear-gradient(to bottom, transparent, rgb(38 43 52 / .55), transparent);
  border-bottom: 1px solid var(--bench-700);
}
.tab {
  height: 24px; padding: 0 10px; border-radius: 4px;
  font: 500 11px/24px var(--font-ui); color: var(--bench-400);
  transition: color 120ms, background 120ms;
}
.tab:hover { color: var(--bench-200); }
.tab[aria-selected="true"] { color: var(--bench-100); background: var(--bench-800); }
.term { flex: 1; overflow-y: auto; padding: 10px 14px; font: 400 13px/1.6 var(--font-mono); min-height: 0; }
.term .in { color: var(--bench-100); }
.term .in::before { content: ">>> "; color: var(--led); }
.term .out { color: var(--bench-200); }
.term .dim { color: var(--bench-400); }
.term .err { color: var(--danger); }
.term .amber { color: var(--amber); }
.term .caret { display: inline-block; width: 7px; height: 14px; background: var(--led); vertical-align: -2px; animation: blink 1.1s step-end infinite; }
@keyframes blink { 50% { opacity: 0; } }
.cursor-line { background: var(--bench-850); }
/* 注意：.chip 是 flex 子項時，display:inline-flex 會被 blockify 成 flex，
   而 Chromium 在某些組合下會把它的 max-content 寬度算成 0，
   結果徽章被壓成 14px、「已安裝」溢出（原型實測）。
   解法：明寫 width: max-content。不要拿掉這行。 */
.chip {
  display: inline-flex; align-items: center; flex: 0 0 auto;
  width: max-content; max-width: 100%;
  padding: 1px 6px; border-radius: 99px;
  font: 500 10px/1.6 var(--font-ui); border: 1px solid var(--bench-600); color: var(--bench-200);
  white-space: nowrap;
}
.chip.amber { color: var(--amber); border-color: rgb(240 165 60 / .45); background: rgb(240 165 60 / .08); }
.chip.led { color: var(--led); border-color: rgb(47 224 168 / .45); background: rgb(47 224 168 / .08); }

/* ── 狀態列 ── */
.status {
  grid-area: status;
  background: var(--bench-900); border-top: 1px solid var(--bench-700);
  display: flex; align-items: center; gap: 14px; padding: 0 12px;
  font: 400 11px/1 var(--font-mono); color: var(--bench-400);
}
.status .sep { width: 1px; height: 12px; background: var(--bench-700); }
.status .grow { flex: 1; }
.status kbd {
  font: 500 10px/1 var(--font-mono); color: var(--bench-200);
  border: 1px solid var(--bench-600); border-radius: 3px; padding: 2px 5px; background: var(--bench-850);
}

/* ═══ 編輯器 ═══ */
.tabs { display: flex; align-items: stretch; height: 36px; border-bottom: 1px solid var(--bench-700); background: var(--bench-900); padding-right: 8px; }
.tabs .f {
  display: flex; align-items: center; gap: 7px; padding: 0 14px;
  font: 400 12px/1 var(--font-mono); color: var(--bench-400);
  border-right: 1px solid var(--bench-700); position: relative;
}
.tabs .f:hover { color: var(--bench-200); }
.tabs .f[aria-selected="true"] { color: var(--bench-100); background: var(--bench-950); }
.tabs .f[aria-selected="true"]::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--led); }
.tabs .f .dirty { width: 6px; height: 6px; border-radius: 99px; background: var(--amber); }
.tabs .f .x { color: var(--bench-600); font-size: 13px; }
.tabs .f .x:hover { color: var(--bench-100); }

.code { --lh: 21px; display: flex; font: 400 13px/var(--lh) var(--font-mono); padding: 10px 0 40px; }
.gutter {
  flex: 0 0 auto; padding: 0 12px 0 16px; text-align: right;
  color: var(--bench-600); background: var(--bench-900); border-right: 1px solid var(--bench-700);
  user-select: none;
}
.gutter div { height: var(--lh); }
.lines { flex: 1; min-width: 0; padding-left: 16px; }
.lines div { height: var(--lh); white-space: pre; }
.lines .cur { background: var(--bench-850); margin: 0 -100vw; padding: 0 100vw; }
.k { color: #c792ea; } .s { color: #a5d6a7; } .n { color: #f0a53c; }
.c { color: var(--bench-400); font-style: italic; } .f2 { color: #82aaff; } .op { color: var(--bench-200); }
.wave { text-decoration: underline wavy var(--danger); text-underline-offset: 3px; }
.inline-err { color: var(--danger); }

/* ═══ 燒錄精靈 ═══ */
.wiz { padding: 24px 28px 40px; max-width: 1080px; }
.wiz h1 { font: 600 20px/1.2 var(--font-display); color: var(--bench-100); margin: 0 0 4px; }
.wiz .sub { color: var(--bench-400); margin: 0 0 20px; }
.steps { display: flex; gap: 4px; margin-bottom: 24px; flex-wrap: wrap; }
.steps button {
  display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 10px;
  border: 1px solid var(--bench-700); border-radius: 99px;
  font: 500 12px/1 var(--font-ui); color: var(--bench-400);
}
.steps button .num {
  width: 18px; height: 18px; border-radius: 99px; display: grid; place-items: center;
  background: var(--bench-800); font: 600 10px/1 var(--font-mono); color: var(--bench-400);
}
.steps button[data-state="done"] { color: var(--bench-200); border-color: var(--led-dim); }
.steps button[data-state="done"] .num { background: var(--led-dim); color: var(--led); }
.steps button[data-state="now"] { color: var(--bench-100); border-color: var(--bench-600); background: var(--bench-850); }
.steps button[data-state="now"] .num { background: var(--led); color: #06231a; }

.card { border: 1px solid var(--bench-700); border-radius: 8px; background: var(--bench-900); margin-bottom: 12px; }
.card-h { padding: 10px 14px; border-bottom: 1px solid var(--bench-700); display: flex; align-items: center; gap: 10px; }
.card-b { padding: 14px; }

.boardgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(232px, 1fr)); gap: 8px; }
.board-opt {
  text-align: left; padding: 11px 13px; border: 1px solid var(--bench-700); border-radius: 8px;
  background: var(--bench-850); transition: border-color 120ms, background 120ms;
}
.board-opt:hover { border-color: var(--bench-600); }
.board-opt[aria-pressed="true"] { border-color: var(--led); background: rgb(47 224 168 / .06); }
.board-opt .t { font: 500 13px/1.3 var(--font-ui); color: var(--bench-100); }
.board-opt .m { font: 400 10px/1.4 var(--font-mono); color: var(--bench-400); margin-top: 4px; }

/* 固件來源三選一 */
.srcs { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 8px; }
.src {
  text-align: left; padding: 13px; border: 1px solid var(--bench-700); border-radius: 8px; background: var(--bench-850);
}
.src:hover { border-color: var(--bench-600); }
.src[aria-pressed="true"] { border-color: var(--led); background: rgb(47 224 168 / .06); }
.src .t { font: 600 12px/1 var(--font-display); letter-spacing: .04em; text-transform: uppercase; color: var(--bench-200); }
.src .v { font: 400 12px/1.5 var(--font-mono); color: var(--bench-100); margin-top: 8px; word-break: break-all; }
.src .h { font: 400 10px/1.5 var(--font-mono); color: var(--bench-400); }
.drop { border: 1px dashed var(--bench-600); border-radius: 8px; padding: 18px; text-align: center; color: var(--bench-400); background: var(--bench-850); }
.drop.hot { border-color: var(--solder); color: var(--bench-100); background: rgb(88 196 220 / .06); }

/* ★ FLASH MAP — 設計簽名
   注意：bootloader / partition table / app 全部落在 4MB 的前 0.7%，
   純線性比例會讓三個標籤疊成一團。所以前兩段給固定最小寬度，
   並在軸上誠實標出「不按比例」的區間與實際位址。 */
.flashmap { border: 1px solid var(--bench-700); border-radius: 8px; background: var(--bench-900); overflow: hidden; }
.fm-axis { height: 22px; display: flex; border-bottom: 1px solid var(--bench-700); background: var(--bench-850); }
.fm-axis .tk {
  flex: 0 0 auto; padding: 0 0 0 7px; display: flex; align-items: center; gap: 6px;
  font: 400 10px/1 var(--font-mono); color: var(--bench-400); white-space: nowrap;
}
.fm-axis .tk + .tk { border-left: 1px solid var(--bench-700); }
.fm-axis .tk.free { color: var(--bench-600); }
.fm-axis .tk.min { border-left-style: dashed; }
.fm-body { display: flex; height: 58px; }
.fm-seg { position: relative; min-width: 0; padding: 10px 8px 0 9px; border-right: 1px solid var(--bench-700); overflow: hidden; }
.fm-seg:last-child { border-right: 0; }
.fm-seg .nm { font: 500 10px/1.3 var(--font-mono); color: var(--bench-100); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.fm-seg .sz { font: 400 10px/1.4 var(--font-mono); color: var(--bench-400); margin-top: 2px; white-space: nowrap; overflow: hidden; }
.fm-seg .fill { position: absolute; left: 0; bottom: 0; height: 3px; background: var(--amber); transition: width 120ms linear; }
.fm-seg[data-status="done"] { background: rgb(47 224 168 / .05); }
.fm-seg[data-status="done"] .fill { background: var(--led); width: 100% !important; }
.fm-seg[data-status="writing"] { background: rgb(240 165 60 / .06); }
.fm-seg[data-status="writing"] .nm { color: var(--amber); }
.fm-seg[data-status="error"] { background: rgb(255 90 95 / .08); }
.fm-seg[data-status="error"] .fill { background: var(--danger); }
.fm-seg[data-status="free"] { background-image: repeating-linear-gradient(135deg, transparent 0 5px, rgb(38 43 52 / .75) 5px 6px); }
.fm-seg[data-status="free"] .nm { color: var(--bench-400); }
.fm-foot { display: flex; align-items: center; gap: 12px; padding: 9px 12px; border-top: 1px solid var(--bench-700); background: var(--bench-850); }
.fm-foot .chip { flex: 0 0 auto; white-space: nowrap; }
.fm-foot .rate { margin-left: auto; font: 400 11px/1 var(--font-mono); color: var(--bench-200); white-space: nowrap; }
.fm-note { padding: 6px 12px 0; font: 400 10px/1.5 var(--font-ui); color: var(--bench-400); }
.fm-note b { color: var(--bench-200); font-weight: 500; }
.fm-axis .tk { letter-spacing: -.02em; }

/* 進度與按鈕 */
.bar { height: 6px; border-radius: 99px; background: var(--bench-800); overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--amber); width: 0; transition: width 120ms linear; }
.bar[data-tone="led"] i { background: var(--led); }
.btn {
  height: 30px; padding: 0 13px; border-radius: 6px;
  border: 1px solid var(--bench-600); background: var(--bench-800);
  font: 500 12px/1 var(--font-ui); color: var(--bench-100);
  display: inline-flex; align-items: center; gap: 7px;
  transition: background 120ms, border-color 120ms;
}
.btn:hover { background: var(--bench-700); border-color: var(--bench-400); }
.btn:disabled { opacity: .4; cursor: not-allowed; }
.btn.primary { background: rgb(47 224 168 / .14); border-color: rgb(47 224 168 / .55); color: var(--led); font-weight: 600; }
.btn.primary:hover { background: rgb(47 224 168 / .22); border-color: var(--led); }
.btn.primary[disabled] { background: none; color: var(--bench-400); border-color: var(--bench-700); }
.btn.amber { border-color: rgb(240 165 60 / .5); color: var(--amber); background: rgb(240 165 60 / .08); }
.btn.amber:hover { background: rgb(240 165 60 / .16); }
.btn.ghost { border-color: transparent; background: none; color: var(--bench-400); }
.btn.ghost:hover { color: var(--bench-100); background: var(--bench-850); }
.btn.sm { height: 26px; padding: 0 10px; font-size: 11px; }

.log {
  font: 400 11px/1.7 var(--font-mono); color: var(--bench-400);
  height: calc(100vh - 740px); min-height: 76px; max-height: 200px;
  overflow-y: auto; padding: 10px 14px; background: #090a0c;
  border-top: 1px solid var(--bench-700); border-radius: 0 0 8px 8px;
}
.log b { color: var(--bench-200); font-weight: 400; }
.log .ok { color: var(--led); }
.log .wn { color: var(--amber); }
.log .er { color: var(--danger); }

/* ═══ 套件 / 監控 / 裝置 ═══ */
.search {
  height: 32px; width: 100%; padding: 0 12px; border-radius: 6px;
  border: 1px solid var(--bench-700); background: var(--bench-850);
  color: var(--bench-100); font: 400 12px/1 var(--font-ui);
}
.search::placeholder { color: var(--bench-400); }

<script type="module">
import { ESPLoader } from "./vendor/esptool-js.bundle.js";
import {
  capabilities, acquirePort, releaseAllSessions, watchPortEvents,
  explainOpenFailure, trackedPortCount,
} from "./js/serial.js";
import { runFlash, formatBytes, formatRate } from "./js/flasher.js";
import { BOARDS, findBoard, guessBoardByUsb, defaultFlashOptions } from "./js/catalog.js";
import { diagnoseConnectionFailure } from "./js/diagnose.js";

/* ══════════════════════════════════════════════════════════════════════
   這個頁面有兩種執行模式，**同一份 UI、同一份程式碼**：

   1. 純靜態（start-web.cmd）
      燒錄走 Web Serial + esptool-js，**完全離線**。
      唯一的限制：Web Serial 沒有「列出所有序列埠」的 API，要靠系統對話框。

   2. 搭配 Python 服務（python -m mptools）
      額外得到完整的埠清單、VID:PID、晶片型號、以及「這個埠被誰佔用」。
      **選配，不是必要** —— 沒有它燒錄照樣能跑。

   HAS_BACKEND 就是分辨這兩種模式的旗標。用到後端的地方都必須先問它。
   ══════════════════════════════════════════════════════════════════════ */
const HAS_BACKEND = location.port === "8765";

/** 呼叫本機服務。沒有後端時回 null，呼叫端要能處理。 */
async function api(path, options) {
  if (!HAS_BACKEND) return null;
  try {
    const response = await fetch(path, Object.assign({ headers: { "Content-Type": "application/json" } }, options || {}));
    return await response.json();
  } catch (error) {
    console.warn("[mpt] 本機服務沒有回應", error);
    return null;
  }
}

/* ══════════════════════════════════════════════════════════════════════
   原型狀態。真實版會是 zustand slices（見 docs/PLAN.md 的 D5）。
   ══════════════════════════════════════════════════════════════════════ */
const S = {
  connected: false,
  status: "off",         // off | connecting | idle | busy | error
  view: "edit",
  ptab: "repl",
  busy: null,            // { owner, label }
  board: { name: "尚未連線", chip: "—", port: "", baud: 115200, flash: "—", fw: "—", mac: "—" },
  wizard: {
    step: 1, boardId: null, src: "official", progress: 0, phase: "idle", erase: false,
    // ── 真實燒錄用的欄位 ──────────────────────────────────────────
    firmwareData: null, firmwareName: "", firmwareAddress: 0, firmwareVariant: null,
    baudrate: 921600, eraseAll: false, resetMode: "default_reset",
    usbId: null, chip: null, logs: [], rate: 0, eta: null, failure: null,
  },
};

const $  = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
const esc = (s) => String(s).replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

/* ── toast ───────────────────────────────────────────────────────────── */
const ICON = {
  ok:  '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>',
  warn:'<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 8v5M12 17h.01"/><circle cx="12" cy="12" r="9"/></svg>',
  err: '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M15 9l-6 6M9 9l6 6"/><circle cx="12" cy="12" r="9"/></svg>',
};
function toast(kind, title, body = "", persist = false) {
  const el = document.createElement("div");
  el.className = "toast"; el.dataset.kind = kind;
  el.innerHTML = `<span class="ic">${ICON[kind]}</span><div><div class="tt">${esc(title)}</div>${body ? `<div class="tb">${esc(body)}</div>` : ""}</div>`;
  el.addEventListener("click", () => el.remove());
  $("#toasts").appendChild(el);
  const live = [...$("#toasts").children];
  if (live.length > 3) live[0].remove();
  if (!persist) setTimeout(() => el.remove(), kind === "ok" ? 3000 : 6000);
}
const sleep = (ms) => new Promise((r) => setTimeout(r, ms));

/* ══════════════════════════════════════════════════════════════════════
   側欄：三種內容（裝置 / 檔案 / 說明），依目前 view 切換
   ══════════════════════════════════════════════════════════════════════ */
const TREE = {
  name: "/", open: true, children: [
    { name: "boot.py", size: 142 },
    { name: "main.py", size: 89, sel: true },
    { name: "lib", dir: true, open: true, children: [
      { name: "sensor.py", size: 2140 },
      { name: "ssd1306.mpy", size: 8192, readonly: true },
    ]},
    { name: "webrepl_cfg.py", size: 34 },
  ],
};
let uploading = null;   // { path, pct }

function treeRow(node, depth, out) {
  const pad = depth === 0 ? "" : depth === 1 ? "indent" : "indent2";
  if (node.dir) {
    out.push(`<div class="row ${pad}" data-dir="1"><span class="tw">${node.open ? "▾" : "▸"}</span>
      <span class="ic" style="color:var(--solder)">▣</span><span>${esc(node.name)}</span></div>`);
    if (node.open) node.children.forEach((c) => treeRow(c, depth + 1, out));
  } else {
    const uploadingHere = uploading && uploading.path.endsWith(node.name);
    out.push(`<div class="row ${pad}" data-file="${esc(node.name)}" data-selected="${node.sel ? "true" : "false"}" title="${esc(node.name)}">
      <span class="tw"></span>
      <span class="ic" style="color:${node.readonly ? "var(--bench-400)" : "var(--bench-200)"}">
        <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H7a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7z"/></svg>
      </span>
      <span>${esc(node.name)}</span>
      <span class="sz">${node.size > 1024 ? (node.size / 1024).toFixed(1) + " K" : node.size + " B"}</span>
      ${uploadingHere ? `<span class="up"><i style="width:${uploading.pct}%"></i></span>` : ""}
    </div>`);
  }
}

function renderSide() {
  const isDevice = S.view === "device" || S.view === "monitor";
  $("#side-title").textContent = isDevice ? "裝置" : S.view === "packages" ? "套件來源" : "檔案";
  const b = S.board, body = $("#side-body"), foot = $("#side-foot");

  if (!S.connected) {
    body.innerHTML = `<p style="color:var(--bench-400);margin:0 0 12px">尚未連線裝置。連線後這裡會顯示晶片資訊與裝置上的檔案。</p>
      <button class="btn primary" data-act="connect" style="width:100%;justify-content:center">連線裝置</button>`;
    foot.innerHTML = "";
    return;
  }

  if (isDevice) {
    const fsUse = 34, heapUse = 42;
    body.innerHTML = `
      <dl class="dl">
        <dt>Chip</dt><dd>${esc(b.chip)}</dd>
        <dt>MAC</dt><dd>${esc(b.mac)}</dd>
        <dt>Port</dt><dd>${esc(b.port)} · ${b.baud.toLocaleString()}</dd>
        <dt>Flash</dt><dd>${esc(b.flash)} · dio · 80 MHz</dd>

      </dl>
      <div class="section-t"><span class="label">檔案系統</span></div>
      <div class="mono" style="font-size:11px">1.34 MB 可用 / 2.0 MB
        <div class="meter"><i style="width:${fsUse}%"></i></div></div>
      <div class="section-t"><span class="label">記憶體</span></div>
      <div class="mono" style="font-size:11px">184 KB 可用 / 320 KB
        <div class="meter"><i style="width:${heapUse}%"></i></div></div>
      <div class="section-t"><span class="label">運作時間</span></div>
      <div class="mono" style="font-size:11px">00:14:22</div>`;
    foot.innerHTML = `
      <button class="btn sm" data-act="soft-reset">軟重置</button>
      <button class="btn sm" data-act="bootloader">進 bootloader</button>
      <button class="btn sm amber" data-act="wipe">抹除檔案系統</button>`;
    return;
  }

  // 檔案樹（根節點不畫自己，直接畫它的子項）
  const out = [];
  TREE.children.forEach((c) => treeRow(c, 0, out));
  body.innerHTML = `<div class="tree">${out.join("")}</div>`;
  foot.innerHTML = `
    <button class="btn sm" data-act="refresh">⟳ 重新整理</button>
    <button class="btn sm" data-act="upload">⬆ 上傳</button>
    <button class="btn sm" data-act="download-all">⬇ 全部下載</button>`;
}

/* ══════════════════════════════════════════════════════════════════════
   CANVAS：五個 view
   ══════════════════════════════════════════════════════════════════════ */
function renderEmptyCanvas() {
  return `<div class="empty"><div class="inner">
    <svg width="180" height="120" viewBox="0 0 180 120" class="board-outline" aria-hidden="true">
      <rect x="8" y="8" width="164" height="104" rx="6"/>
      <rect x="118" y="26" width="42" height="42" rx="3" class="pin"/>
      <rect x="26" y="34" width="72" height="58" rx="3" class="pin"/>
      <path class="pin" d="M26 46h-14M26 58h-14M26 70h-14M26 82h-14M112 46h-14M112 58h-14M112 70h-14M112 82h-14"/>
      <circle cx="20" cy="100" r="4" class="lit"/>
      <circle cx="34" cy="100" r="4" class="pin"/>
      <circle cx="148" cy="100" r="4" class="pin"/>
      <path class="pin" d="M40 20h60M40 20v6M100 20v6"/>
    </svg>

/* ★ 設計簽名：FLASH MAP ───────────────────────────────────────────────
   規格見 docs/UI-DESIGN.md 第 4 節。三個重點：
     1. 寬度用 flex-grow ∝ 位元組數 —— **不要用寫死的像素比例**，那會隨容器寬度失真
     2. 低址保留區（ESP 的 bootloader + partition table 落在前 64 KB）
        只佔 4 MB 的 1.6%，給它最小寬度而不是真實比例，並在說明裡講明
     3. 「未使用」永遠不是「已寫入」—— 它沒有東西被寫進去
   ─────────────────────────────────────────────────────────────────── */

/** 依目前選的板子與固件，算出 Flash Map 的區段。 */
function buildFlashSegments() {
  const w = S.wizard;
  const board = w.boardId ? findBoard(w.boardId) : null;
  const flashBytes = (board?.flashSizeMB ?? 4) * 1024 * 1024;
  const size = w.firmwareData?.length || w.firmwareSize || 0;
  const addr = w.firmwareAddress || 0;
  // 固件之前的保留區。ESP 的 bootloader + partition table 實測落在前 64 KB。
  const headBytes = addr > 0 ? addr : Math.min(0x10000, Math.max(0, flashBytes - size));
  const freeBytes = Math.max(0, flashBytes - headBytes - size);

  const segments = [];
  if (headBytes > 0) {
    segments.push({ name: "保留區", addr: "0x0", bytes: headBytes, status: "free", minWidth: 78,
      hint: "bootloader + partition table（ESP 落在前 64 KB）" });
  }
  segments.push({ name: w.firmwareName || "firmware", addr: `0x${addr.toString(16)}`, bytes: size,
    status: "pending", main: true, minWidth: 120 });
  if (freeBytes > 0) {
    segments.push({ name: "未使用", addr: `0x${(headBytes + size).toString(16)}`, bytes: freeBytes, status: "free" });
  }
  return { segments, flashBytes, freeBytes };
}

function segFill(seg) {
  const w = S.wizard;
  if (seg.status === "free") return 0;
  if (w.phase === "error") return Math.max(4, w.progress);
  if (w.phase === "done") return 100;
  return w.progress;
}

function renderFlashMap() {
  const w = S.wizard;
  const { segments, flashBytes, freeBytes } = buildFlashSegments();

  const axis = segments.map((seg, index) => {
    // 位址 0x0 只標一次 —— 保留區與固件都從 0x0 開始時，軸上兩個 0x0 會讓人誤會
    const label = index > 0 && seg.addr === segments[index - 1].addr ? "" : seg.addr;
    return `<div class="tk ${seg.status === "free" ? "free" : ""}" style="flex:${seg.bytes} 1 0;min-width:${seg.minWidth ?? 64}px">${esc(label) || "&nbsp;"}</div>`;
  }).join("");

  const segs = segments.map((seg) => {
    let status = seg.status;
    if (seg.main) {
      status = w.phase === "done" ? "done" : w.phase === "error" ? "error"
        : (w.phase === "writing" || w.phase === "erasing") ? "writing"
        : (w.progress > 0 ? "writing" : "pending");
    }
    const fill = segFill({ ...seg, status });
    const title = `${seg.name} · ${seg.addr} · ${formatBytes(seg.bytes)}${seg.hint ? " · " + seg.hint : ""}`;
    return `<div class="fm-seg" data-status="${status}" data-main="${seg.main ? "1" : "0"}"
        style="flex:${seg.bytes} 1 0;min-width:${seg.minWidth ?? 64}px" title="${esc(title)}">
      <div class="nm">${status === "done" ? "✓ " : ""}${esc(seg.name)}</div>
      <div class="sz">${esc(formatBytes(seg.bytes))}</div>
      <div class="fill" style="width:${fill}%"></div>
    </div>`;
  }).join("");

  const board = w.boardId ? findBoard(w.boardId) : null;
  const rateText = w.phase === "writing"
    ? `${formatRate(w.rate)}${w.eta != null ? ` · 剩 ~${Math.round(w.eta)}s` : ""}`
    : w.phase === "done" ? "完成" : w.phase === "error" ? "已中止" : "等待中";

  return `<div class="flashmap">
    <div class="fm-axis">${axis}</div>
    <div class="fm-body">${segs}</div>
    <div class="fm-note">
      比例依 <b>${board ? board.flashSizeMB : 4} MB flash</b> 計算。
      左側保留區（ESP 的 bootloader 與 partition table 落在前 64 KB 內，只佔 4 MB 的 1.6%）
      以最小寬度繪製，其餘按真實比例。本工具只寫入<b>一個</b>映像，位址
      <b>0x${(w.firmwareAddress || 0).toString(16)}</b>${freeBytes > 0 ? `，剩 <b>${formatBytes(freeBytes)}</b> 未使用` : ""}。
    </div>
    <div class="fm-foot">
      ${w.phase === "writing" ? `<span class="chip amber">寫入中 ${w.progress.toFixed(1)}%</span>`
        : w.phase === "done" ? `<span class="chip led">完成</span>`
        : w.phase === "error" ? `<span class="chip" style="color:var(--danger);border-color:rgb(255 90 95 / .5)">失敗</span>`
        : w.phase === "connecting" ? `<span class="chip amber">連線中…</span>`
        : `<span class="chip">待機</span>`}
      <span class="mono" style="font-size:11px;color:var(--bench-400)">
        ${esc(w.chip || (board ? `${board.chip}（${board.flashSizeMB} MB）` : "未選板子"))}
        · baud ${w.baudrate} · reset ${esc(w.resetMode)}
      </span>
      <span class="rate">${rateText}</span>
    </div>
  </div>`;
}

/* ══════════════════════════════════════════════════════════════════════
   燒錄 —— 真實 esptool 實作
   ──────────────────────────────────────────────────────────────────────
   這裡取代了原本的模擬動畫。UI（Flash Map、步驟、錯誤面板）完全不變，
   只是把 `setInterval` 換成真的 esptool-js。

   關鍵設計：**esptool 完全擁有序列埠。** 我們只透過 acquirePort() 拿到一個
   尚未開啟的埠並登記，收尾一律走 session.release()。這個規則是在
   "The port is already open" 那個 bug 之後訂下來的（見 docs/WEB-ARCHITECTURE.md 6.2）。
   ══════════════════════════════════════════════════════════════════════ */

/** 閒置的 session／loader，跨次燒錄保留（埠由 esptool 擁有，用完即放）。 */
const flashRuntime = { session: null, loader: null, cancelRequested: false };

/** 依目前選到的板子與埠，套用最不容易出錯的預設值。 */
function applyFlashDefaults() {
  const board = S.wizard.boardId ? findBoard(S.wizard.boardId) : null;
  if (!board) return;
  const nativeUsb = flashRuntime.session?.described?.isNativeUsb ?? false;
  const defaults = defaultFlashOptions(board, { usbSerialJtag: nativeUsb });
  S.wizard.baudrate = defaults.baudrate;
  S.wizard.eraseAll = defaults.eraseAll;
  S.wizard.resetMode = defaults.resetMode;
}

/** 選一個官方固件變體。**只記住中繼資料** —— 檔案要使用者自己下載後拖進來。 */
function pickFirmware(variant) {
  const w = S.wizard;
  w.firmwareVariant = variant.id;
  w.firmwareName = `${variant.board}-${RELEASE.date}-${RELEASE.version}.${variant.ext}`;
  w.firmwareAddress = variant.address || 0;
  w.firmwareSize = variant.sizeBytes || 0;
  w.firmwareUrl = `https://micropython.org/resources/firmware/${w.firmwareName}`;
  w.firmwareData = null; // 還沒真的拿到位元組
}

/** 載入本機固件檔（拖放或檔案選擇）。這是**永遠可用**的保底路線。 */
async function loadLocalFile(file) {
  const w = S.wizard;
  const buffer = await file.arrayBuffer();
  w.firmwareData = new Uint8Array(buffer);
  w.firmwareName = file.name;
  w.firmwareAddress = 0;
  w.firmwareSize = buffer.byteLength;
  w.firmwareVariant = null;
  w.src = "local";
  toast("ok", "已載入本機固件", `${file.name} · ${formatBytes(buffer.byteLength)}`);
  renderCanvas();
}

/** 把 esptool 的輸出一行一行寫進日誌。**不要吞掉它** —— 那是唯一的診斷資訊。 */
function esptoolTerminal() {
  return {
    clean: () => {},
    writeLine: (line) => pushFlashLog(String(line)),
    write: (chunk) => pushFlashLog(String(chunk).replace(/\n+$/, "")),
  };
}

function pushFlashLog(message) {
  if (!message) return;
  S.wizard.logs.push(message);
  if (S.wizard.logs.length > 500) S.wizard.logs.shift();
  const node = document.querySelector("#flash-log");
  if (node) {
    const cls = /error|fail|invalid/i.test(message) ? "er"
      : /warn|note/i.test(message) ? "wn"
      : /hash|verified|leaving|done|ok\b/i.test(message) ? "ok" : "";
    node.insertAdjacentHTML("beforeend", `<div class="${cls}">${esc(message)}</div>`);
    node.scrollTop = node.scrollHeight;
  }
}

async function flashStart() {
  const w = S.wizard;
  if (w.phase === "writing") return;
  if (!w.firmwareData) {
    toast("warn", "還沒有固件", "請先下載官方固件並拖進來，或選擇本機檔案。");
    return;
  }

  flashRuntime.cancelRequested = false;
  w.phase = "preparing"; w.progress = 0;
  w.logs = [];
  setStatus("busy", "燒錄中…");
  $("#strip-slot .led") && ($("#strip-slot .led").dataset.state = "busy");
  $("#repl-state").innerHTML = `<span class="chip amber">執行中</span>`;
  $("#st-hint").innerHTML = `裝置忙碌中：燒錄固件 · <kbd>Esc</kbd> 取消`;
  renderCanvas();
  toast("warn", "開始燒錄", "燒錄中請勿拔線或關閉頁面。", true);

  try {
    // 1) 取得序列埠（必要時跳系統對話框）。acquirePort 內部會先清掉殘留連線。
    if (!flashRuntime.session) {
      pushFlashLog("正在取得序列埠…");
      const session = await acquirePort({ preferredUsbId: S.wizard.usbId });
      if (!session) {
        w.phase = "idle";
        toast("warn", "已取消", "沒有選擇序列埠。");
        return;
      }
      flashRuntime.session = session;
      S.wizard.usbId = session.described.usbId;
      pushFlashLog(`序列埠 ${session.described.usbId}（${session.described.label}）`);
      applyFlashDefaults();
    }

    const session = flashRuntime.session;
    const transport = session.acquire({ trace: false });
    const loader = new ESPLoader({
      transport,
      baudrate: w.baudrate,
      terminal: esptoolTerminal(),
      debugLogging: false,
    });
    flashRuntime.loader = loader;
    pushFlashLog(`loader 已建立 · baud ${w.baudrate} · reset mode ${w.resetMode}`);

    const result = await runFlash({
      loader,
      files: [{ name: w.firmwareName, data: w.firmwareData, address: w.firmwareAddress || 0 }],
      flashMode: "keep", flashFreq: "keep", flashSize: "keep",
      eraseAll: w.eraseAll,
      compress: true,
      resetAfter: true,
      resetMode: w.resetMode || "default_reset",
      baudrate: w.baudrate,
      isCancelled: () => flashRuntime.cancelRequested,
      onEvent: (event) => {
        switch (event.type) {
          case "phase":
            w.phase = event.phase === "connecting" ? "connecting"
              : event.phase === "writing" ? "writing"
              : event.phase === "erasing" ? "erasing"
              : event.phase === "done" ? "done" : event.phase;
            break;
          case "chip":
            w.chip = event.chip;
            S.board.chip = event.chip;
            pushFlashLog(`偵測到 ${event.chip}`);
            break;
          case "progress":
            w.progress = event.percent;
            w.rate = event.bytesPerSecond;
            w.eta = event.etaSeconds;
            break;
          case "log":
            pushFlashLog(`${event.level === "warn" ? "⚠ " : ""}${event.message}`);
            break;
          case "failed":
            w.phase = "error";
            w.failure = event;
            break;
          default:
            break;
        }
        renderCanvas();
      },
    });

    if (result.ok) {
      const board = w.boardId ? findBoard(w.boardId) : null;
      S.board.fw = w.firmwareName || S.board.fw;
      if (board) S.board.name = board.label;
      setStatus("idle", "已連線");
      toast("ok", "燒錄完成",
        `${w.chip || "裝置"} · ${formatBytes(w.firmwareData.length)} · ${formatRate(w.rate || 0)}`);
      pushFlashLog("燒錄完成，裝置已重置。");
    } else if (result.cancelled) {
      setStatus("idle", "已連線");
      toast("warn", "已取消燒錄", "裝置仍可用，可以重試。");
    } else {
      setStatus("error", "燒錄失敗");
      // 失敗之後把「真正的原因」問出來 —— esptool 只會說「連不上」，
      // 而最常見的原因其實是裝置正在跑 MicroPython（見 js/diagnose.js）。
      await runDiagnosis(result.error);
    }
  } catch (error) {
    const explained = explainOpenFailure(error, "這個序列埠");
    w.phase = "error";
    w.failure = { title: explained.title, detail: explained.detail, advice: explained.actions };
    pushFlashLog(`錯誤：${error?.message || error}`);
    setStatus("error", "開啟序列埠失敗");
  } finally {
    // 不論成敗都要把埠收乾淨。少了這一步，拔插之後這個 origin 就再也開不起它，
    // 而且使用者會看到 "The port is already open"。
    try {
      await flashRuntime.session?.release();
    } catch (error) {
      console.warn("[flash] 釋放序列埠失敗", error);
    }
    flashRuntime.session = null;
    flashRuntime.loader = null;
    if (S.wizard.phase !== "error") $("#strip-slot .led") && ($("#strip-slot .led").dataset.state = "idle");
    setStatus(S.wizard.phase === "error" ? "error" : "idle", S.wizard.phase === "error" ? "燒錄失敗" : "已連線");
    $("#repl-state").innerHTML = S.wizard.phase === "error"
      ? `<span class="chip amber">失敗</span>` : `<span class="chip led">就緒</span>`;
    $("#st-hint").innerHTML = `按 <kbd>Ctrl K</kbd> 開啟命令面板`;
    renderCanvas();
  }
}

/**
 * 燒錄失敗之後，判斷「為什麼連不上」。
 *
 * 這是整個流程最重要的一步。實際案例：使用者的 ESP32-S3 正在跑 MicroPython，
 * 而 USB-Serial-JTAG 沒有自動重置電路 —— esptool 三種 reset 模式都連不上，
 * 但錯誤訊息只說「Failed to connect」。使用者會開始換線、降速、重插，
 * 全部都在浪費時間。
 */
async function runDiagnosis(flashError) {
  const w = S.wizard;
  const canDiagnose = /connect|timed out|no serial data/i.test(flashError?.detail || "");
  if (!canDiagnose) {
    w.failure = flashError || w.failure;
    return;
  }

  pushFlashLog("── 開始診斷：為什麼連不上 ──");
  const diagnosis = await diagnoseConnectionFailure({
    reopen: async () => {
      const session = await acquirePort({ preferredUsbId: w.usbId });
      if (!session) throw new Error("無法重新取得序列埠");
      return {
        port: session.port,
        release: async () => {
          try {
            if (session.port.readable || session.port.writable) await session.port.close();
          } catch { /* 已經關了 */ }
          session.forceReleaseTracked();
        },
      };
    },
    onEvent: (event) => {
      if (event.type === "log") pushFlashLog(`${event.level === "warn" ? "⚠ " : ""}${event.message}`);
    },
  });

  if (diagnosis.verdict === "micropython-running") {
    const mp = diagnosis.microPython;
    const variant = mp.firmwareVariant;
    // 自動幫使用者把板子與固件變體選對
    if (variant === "SPIRAM_OCT") {
      const board = BOARDS.find((b) => b.id === "esp32s3-generic");
      if (board) {
        w.boardId = board.id;
        const oct = board.firmware.find((f) => /SPIRAM_OCT/i.test(f.board)) || board.firmware[0];
        if (oct) pickFirmware(oct);
        pushFlashLog("已自動改選 ESP32-S3 SPIRAM_OCT 變體（依裝置 banner 判斷）。");
      }
    }
    w.failure = {
      title: "裝置正在跑 MicroPython —— 它不會回應 bootloader",
      detail: `${mp.version || "MicroPython"}${mp.variant ? ` · ${mp.variant}` : ""}`,
      advice: diagnosis.advice,
      diagnosis,
    };
    pushFlashLog(`診斷結果：${w.failure.title}`);
    toast("warn", "裝置已經有 MicroPython 了", "可能不需要燒錄。詳情見下方診斷。", true);
  } else {
    w.failure = {
      title: flashError?.title || "燒錄失敗",
      detail: flashError?.detail || "",
      advice: diagnosis.advice?.length ? diagnosis.advice : flashError?.advice || [],
      diagnosis,
    };
  }
  renderCanvas();
}

function flashCancel() {
  flashRuntime.cancelRequested = true;
  toast("warn", "正在取消…", "會在目前這個區塊寫完後停止。");
}

  { id: "edit",       t: "回到編輯器",          h: "Ctrl-1", ic: "{}", run: () => go("edit") },
  { id: "monitor",    t: "開啟序列埠監控",      h: "Ctrl-3", ic: "∿", run: () => go("monitor") },
  { id: "packages",   t: "管理套件（mip）",     h: "Ctrl-4", ic: "▤", run: () => go("packages") },
  { id: "device",     t: "裝置資訊",            h: "Ctrl-5", ic: "▣", run: () => go("device") },
  { id: "reset",      t: "軟重置裝置 (Ctrl-D)", h: "",      ic: "↻", run: () => { toast("ok", "裝置已重置"); } },
  { id: "bootloader", t: "進入 bootloader",     h: "",      ic: "⏬", run: () => { toast("warn", "裝置已進入 bootloader", "現在可以燒錄固件。"); go("flash"); } },
  { id: "snapshot",   t: "下載裝置快照",        h: "",      ic: "⬇", run: () => { toast("ok", "快照已下載", "device-snapshot-2026-02-14.zip · 4 個檔案"); } },
  { id: "erase",      t: "抹除檔案系統…",       h: "危險", ic: "⚠", run: () => { toast("warn", "已取消", "抹除需要二次確認。", true); } },
];
let cmdSel = 0, cmdHits = COMMANDS;
function renderCmd(q = "") {
  const s = q.trim().toLowerCase();
  cmdHits = COMMANDS.filter((c) => !s || c.t.toLowerCase().includes(s) || c.id.includes(s));
  cmdSel = Math.min(cmdSel, Math.max(0, cmdHits.length - 1));
  $("#cmd-list").innerHTML = cmdHits.length
    ? cmdHits.map((c, i) => `<div class="it" data-i="${i}" data-sel="${i === cmdSel}">
        <span class="ic">${c.ic}</span><span>${esc(c.t)}</span>
        ${c.h ? `<span class="hint">${esc(c.h)}</span>` : ""}</div>`).join("")
    : `<div class="it" style="color:var(--bench-400)">沒有符合的指令</div>`;
}
function openCmd() { $("#cmdk").dataset.on = "true"; $("#cmd-input").value = ""; cmdSel = 0; renderCmd(); $("#cmd-input").focus(); }
function closeCmd() { $("#cmdk").dataset.on = "false"; }
function runCmd() {
  const c = cmdHits[cmdSel];
  closeCmd();
  c?.run();
}
$("#cmd-input").addEventListener("input", (e) => { cmdSel = 0; renderCmd(e.target.value); });
$("#cmd-list").addEventListener("click", (e) => {
  const it = e.target.closest(".it[data-i]"); if (!it) return;
  cmdSel = +it.dataset.i; runCmd();
});
$("#cmdk").addEventListener("click", (e) => { if (e.target.id === "cmdk") closeCmd(); });
$("#btn-palette").addEventListener("click", openCmd);

/* ══════════════════════════════════════════════════════════════════════
   導覽
   ══════════════════════════════════════════════════════════════════════ */
function syncNav() {
  $$(".rail .nav[data-view]").forEach((b) => {
    b.setAttribute("aria-current", String(b.dataset.view === S.view));
    if (b.dataset.needsDevice === "true") {
      b.disabled = !S.connected;
      const label = b.querySelector("span").textContent;
      b.title = S.connected ? label : "需要先連線裝置";
    }
  });
}
function go(v) {
  S.view = v;
  $$(".view").forEach((el) => el.dataset.on = String(el.dataset.view === v));
  syncNav();
  renderSide(); renderCanvas();
  if (v !== "monitor") stopChart();
}

/* ══════════════════════════════════════════════════════════════════════
   事件委派
   ══════════════════════════════════════════════════════════════════════ */
document.addEventListener("click", async (e) => {
  const nav = e.target.closest(".rail .nav[data-view]");
  if (nav && !nav.disabled) { go(nav.dataset.view); return; }

  const stepBtn = e.target.closest("[data-step]");
  if (stepBtn) {
    const n = +stepBtn.dataset.step;
    if (n >= 1 && n <= 4) { S.wizard.step = n; if (n === 4 && S.wizard.phase === "idle") S.wizard.phase = "idle"; renderCanvas(); }
    return;
  }
  const board = e.target.closest("[data-board]");
  if (board) {
    S.wizard.boardId = board.dataset.board;
    applyFlashDefaults();
    // 選了板子就順便把它的第一個固件選起來，使用者少按一次
    const first = findBoard(S.wizard.boardId)?.firmware?.[0];
    if (first) pickFirmware(first);
    renderCanvas();
    return;
  }
  const firmwareBtn = e.target.closest("[data-firmware]");
  if (firmwareBtn) {
    const variant = findBoard(S.wizard.boardId)?.firmware.find((v) => v.id === firmwareBtn.dataset.firmware);
    if (variant) { pickFirmware(variant); toast("ok", "已選擇固件", variant.label); }
    renderCanvas();
    return;
  }
  const src = e.target.closest("[data-src]");
  if (src) {
    S.wizard.src = src.dataset.src;
    renderCanvas();
    if (src.dataset.src === "local") $("#file-input")?.click();
    return;
  }
  const board2 = e.target.closest("[data-goto]");
  if (board2) { go(board2.dataset.goto); return; }
  const tab = e.target.closest("[data-ptab]");
  if (tab) {
    $$("[data-ptab]").forEach((b) => b.setAttribute("aria-selected", String(b === tab)));
    S.ptab = tab.dataset.ptab;
    $("#term").innerHTML = S.ptab === "repl"
      ? (S.connected ? "" : `<div class="dim">連線裝置後，這裡會出現 MicroPython 的 REPL。</div>`)
      : `<div class="dim">裝置日誌（esptool / 協議層的原始輸出）</div><div class="out mono" style="font-size:11px">[12:04:31] serial: opened COM4 @921600<br>[12:04:31] probe: CTRL-C CTRL-A → raw REPL<br>[12:04:32] info: MicroPython v1.25.0 · ESP32-S3<br>[12:04:32] fs: 4 entries on /</div>`;
    if (S.ptab === "repl" && S.connected) renderTerm();
    return;
  }

  const act = e.target.closest("[data-act]")?.dataset.act;
  if (!act) return;
  switch (act) {
    case "connect": connect(); break;
    case "disconnect": disconnect(); break;
    case "refresh": toast("ok", "已重新整理", "讀到 4 個項目。"); break;
    case "upload":
      uploading = { path: "/main.py", pct: 0 };
      toast("ok", "開始上傳", "main.py → 裝置 /main.py（原子寫入）", true);
      const up = setInterval(() => {
        if (!uploading) return clearInterval(up);
        uploading.pct += 8;
        if (uploading.pct >= 100) { clearInterval(up); uploading = null; toast("ok", "上傳完成", "main.py · 89 B · 已驗證"); }
        renderSide();
      }, 120);
      break;
    case "download-all": toast("ok", "已下載 4 個檔案", "存到裝置快照資料夾。"); break;
    case "goto-line": toast("ok", "已跳到第 2 行", "import json — 裝置上沒有這個模組。"); break;
    case "run": termLine(`<span class="out">&gt;&gt;&gt; <span style="color:var(--bench-100)">exec(open('main.py').read())</span></span>`);
      setTimeout(() => { termLine(`<span class="err">Traceback (most recent call last):</span>`);
        termLine(`<span class="err">  File "&lt;stdin&gt;", line 2, in &lt;module&gt;</span>`);
        termLine(`<span class="err">ImportError: no module named 'json'</span>`);
        toast("err", "執行失敗：ImportError", "裝置上沒有 json 模組。錯誤已對到 main.py 第 2 行。", true); }, 500);
      break;
    case "save": toast("ok", "已儲存到裝置", "main.py · 原子寫入（.tmp → rename）"); break;
    case "interrupt": termLine(`<span class="amber">KeyboardInterrupt</span>`); toast("warn", "已送出 Ctrl-C"); break;
    case "soft-reset": toast("ok", "裝置已重置", "重新進入 REPL。"); renderTerm(); break;
    case "bootloader": toast("warn", "裝置已進入 bootloader", "現在可以直接燒錄。"); go("flash"); break;
    case "wipe": toast("warn", "抹除需要二次確認", "這個動作會刪掉裝置上全部檔案。", true); break;
    case "factory": toast("warn", "恢復出廠固件", "會先抹除再寫入原廠 image。", true); break;
    case "snapshot": toast("ok", "快照已下載", "device-snapshot.zip · 4 個檔案"); break;
    case "flash-start": flashStart(); break;
    case "flash-cancel": flashCancel(); break;
    case "flash-retry":
      S.wizard.phase = "idle"; S.wizard.progress = 0;
      S.wizard.failure = null; S.wizard.logs = [];
      renderCanvas(); toast("ok", "已重設，可以重新燒錄"); break;
    case "flash-460800":
      S.wizard.baudrate = 460800; S.wizard.phase = "idle"; S.wizard.progress = 0;
      renderCanvas(); toast("ok", "baud rate 已改為 460800", "請再按一次「開始燒錄」。"); break;
    case "flash-bootloader-help":
      // 使用者說「我已經按了 BOOT + RESET」→ 直接重試，不要再跑一次診斷
      S.wizard.failure = null; S.wizard.phase = "idle";
      renderCanvas(); flashStart(); break;
    case "erase-confirm":
      S.wizard.phase = "idle"; S.wizard.step = 4; renderCanvas(); flashStart(); break;
    case "erase-cancel":
      S.wizard.eraseAll = false; renderCanvas(); toast("ok", "已取消抹除"); break;
    case "detect":
      // 有本機服務時可以列出真實埠清單；沒有的話只能靠系統對話框
      if (S.connected) { toast("ok", "已重新偵測", S.board.port || "序列埠"); }
      else { toast("warn", "請先按「連線裝置」", "Web Serial 需要使用者手動選擇序列埠。"); }
      break;
    case "pkg-install": {
      const row = e.target.closest("[data-pkg]");
      const name = row.dataset.pkg;
      e.target.outerHTML = `<span class="chip amber">安裝中…</span>`;
      setTimeout(() => { toast("ok", `已安裝 ${name}`, "/lib · 來自 micropython.org/pi"); renderCanvas(); }, 1100);
      break;
    }
    case "pkg-remove": toast("warn", "移除需要確認", "會刪除裝置 /lib 下的檔案。", true); break;
    case "export-csv": toast("ok", "已匯出", "monitor-2026-02-14.csv · 1 284 筆"); break;
    case "clear-flash-log": S.wizard.logs = []; renderCanvas(); break;
    case "release-ports": {
      // 修 "The port is already open" 的自救按鈕。使用者不必重新整理頁面。
      const released = await releaseAllSessions();
      flashRuntime.session = null;
      toast("ok", "已釋放序列埠", released ? `清理了 ${released} 個殘留連線。` : "沒有殘留連線。");
      break;
    }
  }
});
document.addEventListener("change", (e) => {
  if (e.target.id === "opt-erase") { S.wizard.eraseAll = e.target.checked; renderCanvas(); }
  if (e.target.id === "file-input" && e.target.files?.[0]) loadLocalFile(e.target.files[0]);
});

/* 拖放固件檔 —— 這是永遠可用的保底路線（官網有 CORS，不能直接抓）。 */
document.addEventListener("dragover", (e) => {
  const zone = e.target.closest?.("#dropzone");
  if (!zone) return;
  e.preventDefault();
  zone.classList.add("hot");
});
document.addEventListener("dragleave", (e) => {
  e.target.closest?.("#dropzone")?.classList.remove("hot");
});
document.addEventListener("drop", async (e) => {
  const zone = e.target.closest?.("#dropzone");
  if (!zone) return;
  e.preventDefault();
  zone.classList.remove("hot");
  const file = e.dataTransfer?.files?.[0];
  if (file) await loadLocalFile(file);
});

/* ══════════════════════════════════════════════════════════════════════
   鍵盤
   ══════════════════════════════════════════════════════════════════════ */
addEventListener("keydown", (e) => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === "k") { e.preventDefault(); openCmd(); return; }
  if ($("#cmdk").dataset.on === "true") {
    if (e.key === "Escape") { e.preventDefault(); closeCmd(); }
    else if (e.key === "ArrowDown") { e.preventDefault(); cmdSel = Math.min(cmdSel + 1, cmdHits.length - 1); renderCmd($("#cmd-input").value); }
    else if (e.key === "ArrowUp") { e.preventDefault(); cmdSel = Math.max(cmdSel - 1, 0); renderCmd($("#cmd-input").value); }
    else if (e.key === "Enter") { e.preventDefault(); runCmd(); }
    return;
  }
  if (e.ctrlKey || e.metaKey) {
    const map = { "1": "edit", "2": "flash", "3": "monitor", "4": "packages", "5": "device" };
    if (map[e.key]) {
      e.preventDefault();
      const v = map[e.key];
      if ((v === "monitor" || v === "packages" || v === "device") && !S.connected) { toast("warn", "需要先連線裝置"); return; }
      go(v);
    }
    if (e.key === "`") { e.preventDefault(); const p = $(".canvas-wrap"); const h = p.style.gridTemplateRows; p.style.gridTemplateRows = h.includes("0px") ? "1fr 6px var(--panel-h)" : "1fr 6px 0px"; }
  }
  if (e.key === "Escape" && S.wizard.phase === "writing") flashCancel();
});

/* ══════════════════════════════════════════════════════════════════════
   面板拖曳
   ══════════════════════════════════════════════════════════════════════ */
(() => {
  const grip = $("#grip"), wrap = $(".canvas-wrap");
  let dragging = false;
  grip.addEventListener("pointerdown", (e) => { dragging = true; grip.setPointerCapture(e.pointerId); document.body.style.cursor = "row-resize"; });
  grip.addEventListener("pointermove", (e) => {
    if (!dragging) return;
    const rect = wrap.getBoundingClientRect();
    const h = Math.min(Math.max(rect.bottom - e.clientY, 120), rect.height * .7);
    wrap.style.gridTemplateRows = `1fr 6px ${h}px`;
    if (S.view === "monitor") drawChart();
  });
  grip.addEventListener("pointerup", (e) => { dragging = false; grip.releasePointerCapture(e.pointerId); document.body.style.cursor = ""; });
})();

/* ══════════════════════════════════════════════════════════════════════
   監控圖表（原生 canvas，不用繪圖庫）
   ══════════════════════════════════════════════════════════════════════ */
const N = 120;
const series = [
  { key: "t", color: "#2fe0a8", data: [], min: 18, max: 32, v: 24.6 },
  { key: "h", color: "#58c4dc", data: [], min: 30, max: 80, v: 58.2 },
  { key: "m", color: "#f0a53c", data: [], min: 120, max: 220, v: 184 },
];
for (const s of series) for (let i = 0; i < N; i++) s.data.push(s.v + (Math.random() - .5) * (s.max - s.min) * .06);
let chartTimer = null;
function startChart() {
  drawChart();
  if (chartTimer) return;
  chartTimer = setInterval(() => {
    for (const s of series) {
      const span = (s.max - s.min);
      s.v = Math.min(s.max, Math.max(s.min, s.v + (Math.random() - .5) * span * .05));
      s.data.push(s.v); s.data.shift();
    }
    $("#mv-t").textContent = series[0].v.toFixed(1) + " °C";
    $("#mv-h").textContent = series[1].v.toFixed(1) + " %";
    $("#mv-m").textContent = Math.round(series[2].v) + " KB";
    $("#mv-n").textContent = (1284 + Math.floor(Date.now() / 2000) % 9999).toLocaleString();
    drawChart();
  }, 700);
}
function stopChart() { if (chartTimer) { clearInterval(chartTimer); chartTimer = null; } }
function drawChart() {
  const c = $("#chart"); if (!c) return;
  const dpr = devicePixelRatio || 1;
  const w = c.clientWidth, h = 240;
  c.width = w * dpr; c.height = h * dpr;
  const g = c.getContext("2d");
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.clearRect(0, 0, w, h);
  g.strokeStyle = "rgba(38,43,52,.9)"; g.lineWidth = 1;
  for (let i = 0; i <= 4; i++) {
    const y = Math.round(8 + (h - 24) * i / 4) + .5;
    g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke();
    g.fillStyle = "#6b7486"; g.font = "10px 'IBM Plex Mono', monospace";
    g.fillText(String(100 - i * 25) + "%", 2, y - 3);
  }
  for (const s of series) {
    g.strokeStyle = s.color; g.lineWidth = 1.6; g.beginPath();
    s.data.forEach((v, i) => {
      const x = (i / (N - 1)) * (w - 4) + 2;
      const y = 8 + (h - 24) * (1 - (v - s.min) / (s.max - s.min));
      i ? g.lineTo(x, y) : g.moveTo(x, y);
    });
    g.stroke();
    const lv = s.data[N - 1];
    const x = w - 2, y = 8 + (h - 24) * (1 - (lv - s.min) / (s.max - s.min));
    g.fillStyle = s.color; g.beginPath(); g.arc(x, y, 2.6, 0, 7); g.fill();
  }
}

/* ══════════════════════════════════════════════════════════════════════
   測試掛鉤
   ──────────────────────────────────────────────────────────────────────
   讓 UI 的各個檢視能被自動驗證，不需要硬體。**刻意保持極小**：只有狀態、
   檢視切換與渲染，沒有行為。改這裡的時候不要順手加東西。
   ══════════════════════════════════════════════════════════════════════ */
window.__MPT_TEST__ = {
  S, go, renderCanvas, renderSide, pickFirmware, loadLocalFile, applyFlashDefaults,
  buildFlashSegments, formatBytes, BOARDS, findBoard,
};

/* ══════════════════════════════════════════════════════════════════════
   啟動
   ══════════════════════════════════════════════════════════════════════ */
syncNav(); renderSide(); renderCanvas(); renderTerm();
setTimeout(() => {
  toast("ok", "mp_Tools 已就緒",
    "燒錄是真的（esptool-js + Web Serial）。編輯器／REPL／檔案總管目前仍是設計稿畫面，還沒接上裝置。",
    true);
}, 400);
</script>
